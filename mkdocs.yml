site_name: Yukh MCP
site_description: A zero-trust capability gateway for safe agent operations.
site_url: https://nomed.github.io/yukh-mcp/
repo_url: https://github.com/nomed/yukh-mcp
repo_name: nomed/yukh-mcp
copyright: Copyright &copy; 2026 Yukh MCP contributors

theme:
  name: material
  logo: assets/repository-mark.svg
  favicon: assets/repository-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Tutorial:
      - Run the read-only demo: guides/read-only-demo.md
  - How-to:
      - Run the inert gateway: how-to/run-inert-gateway.md
      - Run a Yukh Projects shadow migration: guides/yukh-projects-shadow-migration.md
  - Reference:
      - Contracts and implementations: reference/contracts.md
      - Audit writer foundation: reference/audit-writer.md
      - Synthetic setting qualification: reference/example-setting-qualification.md
      - Project 5 Area contract: reference/project-5-area-contract.md
      - Runtime surface: architecture/runtime-skeleton.md
  - Explanation:
      - Why Yukh MCP: concepts/why-yukh.md
      - Architecture: architecture/overview.md
      - Project charter: concepts/project-charter.md
  - Security:
      - Security model: security/security-model.md
      - Threat model: security/threat-model.md
      - Supply-chain baseline: security/supply-chain.md
  - Project:
      - Roadmap: community/roadmap.md
      - Brand assets: community/brand.md
