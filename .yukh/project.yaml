version: 1

project:
  owner: nomed
  repository: yukh-mcp
  name: Yukh

contract:
  marker: yukh
  schema: 1

fields:
  kind:
    project_field: Work Type
    target: issue_type
    required: true
    values:
      gate: Gate
      epic: Epic
      feature: Feature
      task: Task
      bug: Bug
      technical_debt: Technical Debt
  area:
    project_field: Area
    ownership: extension
    required: true
    values:
      governance: Governance
      security: Security
      architecture: Architecture
      runtime: Runtime
      provider: Provider
      audit: Audit
      delivery: Delivery
      documentation: Documentation
      release: Release
  priority:
    project_field: Priority
    required: true
    values:
      P0: P0
      P1: P1
      P2: P2
      P3: P3
  size:
    project_field: Size
    values:
      XS: XS
      S: S
      M: M
      L: L
      XL: XL
  estimate:
    project_field: Estimate
    type: number
  iteration:
    project_field: Iteration
  status:
    project_field: Status
    derived: true

defaults:
  execution: hybrid

workflow:
  in_progress_status: In progress
  review_status: In review

scheduling:
  automatic_iteration: false

safety:
  overwrite_human_values: false
  fail_on_unknown_values: true
  comment_on_validation_error: true

real_use:
  first_micro_task:
    max_team_token_budget: 120000
    max_worker_count: 2
    allowed_runtimes:
      - codex
    required_gates:
      - project_policy
      - preview_runtime
      - provider_adapter
      - launch_readiness
      - worker_activity
  branch_policy:
    strategy: feature_branch_pr
    base: main
    commit_author: producing_agent
    require_human_merge_approval: true
  definition_of_done:
    - tests_passed
    - diff_reviewed
    - activity_recorded
    - token_usage_recorded
