name: Bug report
description: Report reproducible incorrect behavior that is not a vulnerability.
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets, credentials, tokens, personal data, and infrastructure identifiers.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
